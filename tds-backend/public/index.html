<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDS Portal | Role Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'}</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 dark:bg-[#0f172a] text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 md:p-8 relative overflow-hidden">
    <!-- Theme Toggle -->
    <div class="absolute top-6 right-6 z-50">
        <button onclick="TDS_PORTAL.ui.toggleTheme()" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white relative transition-colors bg-white/50 dark:bg-black/20 rounded-xl border border-black/10 dark:border-white/10 shadow-sm backdrop-blur-md">
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
        </button>
    </div>

    <!-- Animated Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-lg mx-auto animate-fade-in">
        
        <div class="mb-8 text-center">
            <h1 class="text-5xl md:text-6xl font-black tracking-tight text-slate-900 dark:text-white drop-shadow-md">
                TDS <span class="text-blue-500">Portal</span>
            </h1>
        </div>

        <!-- Login Form -->
        <div id="loginContainer" class="glass-card p-8 md:p-10 shadow-2xl relative overflow-hidden animate-slide-up">
            <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                <i data-lucide="lock" class="w-24 h-24"></i>
            </div>
            
            <div class="mb-8 text-center">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Secure Login</h2>
                <p class="text-slate-500 dark:text-slate-400">Enter your credentials to access the system</p>
            </div>

            <form class="space-y-4" onsubmit="event.preventDefault(); login();">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                        <input type="email" id="loginEmail" required
                            class="w-full bg-white dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all"
                            placeholder="name@company.com">
                    </div>
                </div>

                <div>
                     <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                    </div>
                    <div class="relative">
                        <i data-lucide="key-round" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                        <input type="password" id="loginPassword" required
                            class="w-full bg-white dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="w-full btn-primary mt-6 py-3 text-lg transition-all duration-300 flex justify-center items-center">
                    Sign In to Portal
                </button>
            </form>

            <footer class="mt-8 text-center text-slate-500 text-xs">
                <p>© 2026 Employee TDS Management System | Developed by Anish Gupta</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Session is managed by checkAuth on dashboards, no need to clear here
             // localStorage.removeItem("loggedInUser");
        });
        lucide.createIcons();
        
        async function login() {
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                TDS_PORTAL.ui.showToast("Enter email and password", "error");
                return;
            }

            if (email.includes("admin")) {
                TDS_PORTAL.ui.showToast("User does not exist", "error");
                return;
            }

            // Beautiful Loading Animation
            btn.innerHTML = `
                <div class="flex items-center justify-center space-x-3">
                    <svg class="w-6 h-6 text-white animate-spin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 30" class="opacity-30"></circle>
                        <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="opacity-100"></path>
                    </svg>
                    <span class="font-medium tracking-wide">Authenticating...</span>
                </div>
            `;
            btn.disabled = true;
            // Add a vibrant, animated gradient while loading
            btn.classList.add("cursor-wait", "bg-gradient-to-r", "from-blue-600", "via-indigo-500", "to-blue-600", "bg-moving-gradient", "animate-gradient-xy", "scale-[0.98]", "shadow-[0_0_20px_rgba(79,70,229,0.4)]");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("loggedInUser", JSON.stringify(data.user));
                    TDS_PORTAL.ui.showToast(`Login successful as ${data.user.role}`, "success");

                    // Supreme Success Animation
                    btn.classList.remove("btn-primary", "cursor-wait", "bg-gradient-to-r", "from-blue-600", "via-indigo-500", "to-blue-600", "bg-moving-gradient", "animate-gradient-xy", "scale-[0.98]", "shadow-[0_0_20px_rgba(79,70,229,0.4)]");
                    
                    btn.classList.add("!bg-emerald-500", "ring-4", "ring-emerald-500/40", "scale-105", "shadow-[0_0_30px_rgba(16,185,129,0.5)]");
                    btn.innerHTML = `
                        <div class="flex items-center justify-center space-x-2">
                            <svg class="w-8 h-8 text-white checkmark-draw" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                            <span class="font-bold text-xl tracking-wide">Welcome In</span>
                        </div>
                    `;
                    
                    // Gorgeous 3D flip out
                    const container = document.getElementById("loginContainer");
                    container.style.transition = ""; // Reset earlier transitions
                    container.classList.add("animate-flip-out-3d");

                    // Flash transition to white before redirecting
                    const flash = document.createElement("div");
                    flash.className = "fixed inset-0 bg-white dark:bg-slate-900 z-[100] transition-opacity duration-[800ms] pointer-events-none opacity-0";
                    document.body.appendChild(flash);
                    
                    setTimeout(() => {
                        flash.classList.remove("opacity-0");
                        flash.classList.add("opacity-100");
                    }, 300);

                    setTimeout(() => {
                        if (data.user.role === "HR") window.location.href = "hr-dashboard.html";
                        else window.location.href = "dashboard.html";
                    }, 1000);

                } else {
                    // Shake animation for error
                    btn.classList.add("animate-custom-shake", "!bg-red-500");
                    setTimeout(() => btn.classList.remove("animate-custom-shake", "!bg-red-500"), 500);
                    
                    TDS_PORTAL.ui.showToast(data.message || "Login failed", "error");
                    
                    // Reset
                    setTimeout(() => {
                        btn.classList.remove("cursor-wait", "bg-gradient-to-r", "from-blue-600", "via-indigo-500", "to-blue-600", "bg-moving-gradient", "animate-gradient-xy", "scale-[0.98]", "shadow-[0_0_20px_rgba(79,70,229,0.4)]");
                        btn.innerHTML = "Sign In to Portal";
                        btn.disabled = false;
                    }, 500);
                }
            } catch (error) {
                TDS_PORTAL.ui.showToast("Server not responding", "error");
                btn.classList.remove("cursor-wait", "bg-gradient-to-r", "from-blue-600", "via-indigo-500", "to-blue-600", "bg-moving-gradient", "animate-gradient-xy", "scale-[0.98]", "shadow-[0_0_20px_rgba(79,70,229,0.4)]");
                btn.innerHTML = "Sign In to Portal";
                btn.disabled = false;
            }
        }
    </script>
    <style>
        .active-role {
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .bg-moving-gradient { background-size: 200% 200%; }
        @keyframes gradient-xy {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animate-gradient-xy { animation: gradient-xy 3s ease infinite; }
        
        @keyframes flip-out-3d {
            0% { transform: perspective(1000px) rotateX(0) scale(1); opacity: 1; filter: blur(0); }
            100% { transform: perspective(1000px) rotateX(15deg) translateY(-30px) scale(0.95); opacity: 0; filter: blur(5px); }
        }
        .animate-flip-out-3d { animation: flip-out-3d 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        .checkmark-draw {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: draw 0.8s cubic-bezier(0.65, 0, 0.45, 1) 0.1s forwards;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        
        @keyframes custom-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .animate-custom-shake { animation: custom-shake 0.5s ease-in-out; }
    </style>
</body>

</html>
